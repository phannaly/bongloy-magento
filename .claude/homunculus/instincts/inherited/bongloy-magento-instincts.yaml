# Bongloy Magento Workflow Add New Payment Method

## Action

Follow the add-new-payment-method workflow:
1. Create or update a Model/Config/PaymentMethodName.php config file.
2. Update etc/adminhtml/system.xml, etc/config.xml, and etc/di.xml to register the method.
3. Add or update frontend JS renderer: view/frontend/web/js/view/payment/method-renderer/omise-offsite-<payment>-method.js.
4. Add or update frontend HTML template: view/frontend/web/template/payment/offsite-<payment>-form.html.
5. Update Helper/OmiseHelper.php and/or Gateway/Request/APMBuilder.php for method logic.
6. Update view/frontend/web/css/styles.css and add logo/image if needed.
7. Update view/frontend/layout/checkout_index_index.xml to include the renderer.
8. Update Model/Capabilities.php and/or Model/Ui/CapabilitiesConfigProvider.php if dynamic capabilities are involved.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: Model/Config/*.php, etc/adminhtml/system.xml, etc/config.xml

